# ─── Rappi Favor Backend — application.properties ────────────────────────────
# Este archivo contiene configuración no sensible.
# Los secretos (URIs, credenciales) van en .env o Heroku Config Vars.
#
# Nota: Spark Java no usa application.properties automáticamente como Spring Boot.
# AppConfig.java lee estas propiedades mediante dotenv o System.getenv().
# ─────────────────────────────────────────────────────────────────────────────

# Nombre de la aplicación (informativo)
app.name=Rappi Favor Backend
app.version=1.0.0
app.env=development

# Nombre de la base de datos en MongoDB Atlas
# La URI de conexión va en .env → MONGO_URI
mongo.database.name=rappifavor

# Colecciones MongoDB (consistentes con el modelo de datos del SRS)
mongo.collection.usuarios=usuarios
mongo.collection.pedidos=pedidos
mongo.collection.disputas=disputas

# Configuración del servidor (el puerto real lo inyecta Heroku via PORT)
server.port.default=8080
